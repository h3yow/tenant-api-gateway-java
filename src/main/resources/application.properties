# 多租户 API 网关（本地模拟，无外部服务依赖）
server.port=8080
spring.application.name=tenant-api-gateway-java

# 租户静态配置：窗口长度 / 窗口调用配额 / 在途并发上限 / 模拟初始余额
gateway.tenants.tenant-a.window-seconds=1
gateway.tenants.tenant-a.quota-limit=5
gateway.tenants.tenant-a.concurrency-limit=2
gateway.tenants.tenant-a.initial-balance=100000

gateway.tenants.tenant-b.window-seconds=1
gateway.tenants.tenant-b.quota-limit=3
gateway.tenants.tenant-b.concurrency-limit=1
gateway.tenants.tenant-b.initial-balance=50000

# 模拟上游慢调用耗时（毫秒），用于并发竞争验证
gateway.upstream.delay-millis=300
