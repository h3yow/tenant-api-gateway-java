# 网关既有约定
# 固定窗口长度（秒）
gateway.window-seconds=60
# 单窗口内每租户允许真正调用上游的请求数
gateway.window-limit=100
# 每租户最大在途并发
gateway.max-concurrent=20

# 租户故障隔离（熔断）
# 连续失败达到该次数后，该租户进入快速失败
gateway.failure-threshold=5
# 快速失败（冷静期）时长，毫秒
gateway.open-duration-millis=30000
# 冷静期后允许同时放行的探测请求数
gateway.probe-permits=1
# 探测进行中给被挡请求的重试等待提示，毫秒
gateway.probe-wait-millis=5000

# 本地验证时可看到租户、窗口、输入与最终判定
logging.level.com.github.h3yow.tenantapigatewayjava=INFO
